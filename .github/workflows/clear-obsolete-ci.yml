name: Clear obsolete Codex CI
on:
  push:
    paths: ['.github/workflows/clear-obsolete-ci.yml']
permissions:
  actions: write
  contents: read
jobs:
  cleanup:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/github-script@v7
        with:
          script: |
            const runs = await github.paginate(github.rest.actions.listWorkflowRunsForRepo,
              {owner: context.repo.owner, repo: context.repo.repo, per_page: 100});
            for (const run of runs) {
              if (run.name !== 'CI' || run.status === 'completed' ||
                  run.head_sha === context.sha || !run.head_branch.startsWith('codex/')) continue;
              core.info(`Cancel superseded CI ${run.id}: ${run.head_branch} ${run.head_sha}`);
              try {
                await github.rest.actions.cancelWorkflowRun({owner: context.repo.owner,
                  repo: context.repo.repo, run_id: run.id});
              } catch (error) {
                if (error.status !== 409) throw error;
              }
            }
